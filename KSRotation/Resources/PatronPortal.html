<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSRotation - Singer Request Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0F172A;
            --card-bg: #1E293B;
            --primary: #8B5CF6;
            --primary-hover: #7C3AED;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --gold: #FCD34D;
            --green: #4ADE80;
            --success-bg: #065F46;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin: 24px 0;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .panel {
            display: none;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .panel.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            background-color: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        button.submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        button.submit-btn:hover {
            background-color: var(--primary-hover);
        }
        .alert {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }
        .alert.success {
            display: block;
            background-color: var(--success-bg);
            color: #A7F3D0;
        }
        .alert.error {
            display: block;
            background-color: #991B1B;
            color: #FECACA;
        }
        .song-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .remove-btn {
            background: none;
            border: none;
            color: #EF4444;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        button.add-btn {
            width: 100%;
            background-color: transparent;
            border: 2px dashed var(--primary);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            margin-bottom: 16px;
        }
        button.add-btn:hover {
            background-color: rgba(139, 92, 246, 0.1);
            border-color: var(--primary-hover);
        }
        .song-entry {
            border-bottom: 1px dashed #334155;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .song-entry:last-of-type {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .past-songs-section {
            margin-top: 24px;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
        .past-songs-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .past-songs-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .past-song-item {
            background-color: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .past-song-item:hover {
            border-color: var(--primary);
            background-color: rgba(139, 92, 246, 0.05);
        }
        .past-song-details {
            font-size: 0.9rem;
            color: var(--text-main);
            text-align: left;
        }
        .past-song-artist {
            color: var(--text-muted);
            font-style: italic;
        }
        .add-past-icon {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
        }
        .singer-row {
            display: flex;
            align-items: center;
            padding: 14px 12px;
            border-bottom: 1px solid #334155;
        }
        .singer-row:last-child {
            border-bottom: none;
        }
        .singer-row.current {
            background-color: rgba(252, 211, 77, 0.08);
            border-left: 4px solid var(--gold);
            border-radius: 4px;
        }
        .singer-row.next {
            background-color: rgba(74, 222, 128, 0.08);
            border-left: 4px solid var(--green);
            border-radius: 4px;
        }
        .singer-row.inactive {
            opacity: 0.4;
        }
        .singer-num {
            font-weight: 700;
            font-size: 0.95rem;
            width: 32px;
            color: var(--text-muted);
        }
        .singer-details {
            flex: 1;
            min-width: 0;
        }
        .singer-name {
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .current .singer-name {
            color: var(--gold);
        }
        .next .singer-name {
            color: var(--green);
        }
        .singer-song {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-left: 8px;
        }
        .badge.current {
            background-color: var(--gold);
            color: #000;
        }
        .badge.next {
            background-color: var(--green);
            color: #000;
        }
        .no-singers {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-style: italic;
        }
        .search-results {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            position: absolute;
            width: 100%;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .search-item {
            padding: 12px 16px;
            border-bottom: 1px solid #0F172A;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .search-item:last-child {
            border-bottom: none;
        }
        .search-item:hover {
            background-color: rgba(139, 92, 246, 0.15);
        }
        .search-item-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }
        .search-item-artist {
            color: var(--text-muted);
            font-size: 0.8rem;
            display: block;
            margin-top: 2px;
        }
        .search-status {
            padding: 12px 16px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>KSRotation</h1>
            <p class="subtitle">Karaoke Request Board</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('request')">Request Song</button>
            <button class="tab-btn" onclick="switchTab('rotation')">View Rotation</button>
        </div>

        <!-- Request Panel -->
        <div id="request-panel" class="panel active">
            <div id="status-alert" class="alert"></div>
            <form id="request-form" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required placeholder="e.g. Charlie">
                </div>
                <div class="form-group" style="position: relative;">
                    <label for="online-search">Search Songs &amp; Artists (Online)</label>
                    <input type="text" id="online-search" placeholder="Search by title, artist, or both..." oninput="handleSearchInput(event)">
                    <div id="search-results-dropdown" class="search-results"></div>
                </div>
                <div id="songs-container">
                    <div class="song-entry" id="song-entry-1">
                        <div class="song-header">
                            <label>Song 1</label>
                        </div>
                        <div class="form-group">
                            <input type="text" class="song-title-input" required placeholder="e.g. Yesterday">
                        </div>
                        <div class="form-group">
                            <input type="text" class="song-artist-input" required placeholder="e.g. The Beatles">
                        </div>
                    </div>
                </div>
                <button type="button" id="add-song-btn" class="add-btn" onclick="addSongEntry()">➕ Add Another Song</button>
                <button type="submit" class="submit-btn">Submit Request</button>
            </form>
            <!-- Past Songs Section -->
            <div id="past-songs-container" class="past-songs-section" style="display: none;">
                <h3 class="past-songs-title">Your Past Songs (Tap to request)</h3>
                <div id="past-songs-list" class="past-songs-list"></div>
            </div>
        </div>

        <!-- Rotation Panel -->
        <div id="rotation-panel" class="panel">
            <div id="rotation-list">
                <div class="no-singers">Loading rotation...</div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));

            if (tab === 'request') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('request-panel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('rotation-panel').classList.add('active');
                loadRotation();
            }
        }

        let songIndex = 1;
        function resetSongsContainer() {
            const container = document.getElementById('songs-container');
            container.innerHTML = `
                <div class="song-entry" id="song-entry-1">
                    <div class="song-header">
                        <label>Song 1</label>
                    </div>
                    <div class="form-group">
                        <input type="text" class="song-title-input" required placeholder="e.g. Yesterday">
                    </div>
                    <div class="form-group">
                        <input type="text" class="song-artist-input" required placeholder="e.g. The Beatles">
                    </div>
                </div>
            `;
            songIndex = 1;
            updateAddButtonVisibility();
        }

        function addSongEntry() {
            const container = document.getElementById('songs-container');
            const entries = container.querySelectorAll('.song-entry');
            if (entries.length >= 3) return;

            songIndex++;
            const newIndex = songIndex;
            const div = document.createElement('div');
            div.className = 'song-entry';
            div.id = `song-entry-${newIndex}`;
            div.innerHTML = `
                <div class="song-header">
                    <label>Song ${entries.length + 1}</label>
                    <button type="button" class="remove-btn" onclick="removeSongEntry(${newIndex})">Remove</button>
                </div>
                <div class="form-group">
                    <input type="text" class="song-title-input" required placeholder="e.g. Yesterday">
                </div>
                <div class="form-group">
                    <input type="text" class="song-artist-input" required placeholder="e.g. The Beatles">
                </div>
            `;
            container.appendChild(div);
            updateLabels();
            updateAddButtonVisibility();
        }

        function removeSongEntry(id) {
            const el = document.getElementById(`song-entry-${id}`);
            if (el) el.remove();
            updateLabels();
            updateAddButtonVisibility();
        }

        function updateLabels() {
            const container = document.getElementById('songs-container');
            const entries = container.querySelectorAll('.song-entry');
            entries.forEach((entry, idx) => {
                const label = entry.querySelector('label');
                if (label) label.textContent = `Song ${idx + 1}`;
            });
        }

        function updateAddButtonVisibility() {
            const container = document.getElementById('songs-container');
            const entries = container.querySelectorAll('.song-entry');
            const btn = document.getElementById('add-song-btn');
            if (entries.length >= 3) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
            }
        }

        async function submitForm(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const alertDiv = document.getElementById('status-alert');

            alertDiv.className = 'alert';
            alertDiv.style.display = 'none';

            const songs = [];
            document.querySelectorAll('.song-entry').forEach(entry => {
                const song = entry.querySelector('.song-title-input').value.trim();
                const artist = entry.querySelector('.song-artist-input').value.trim();
                if (song) {
                    songs.push({ song, artist });
                }
            });

            if (songs.length === 0) {
                alertDiv.textContent = "Please request at least one song.";
                alertDiv.className = 'alert error';
                return;
            }

            try {
                const response = await fetch('/api/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, 
                        song: songs[0].song, 
                        artist: songs[0].artist, 
                        songs: songs 
                    })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    alertDiv.textContent = "Request submitted successfully! Look at the screens to see when you are up.";
                    alertDiv.className = 'alert success';
                    saveRequestToLocal(name, songs);
                    document.getElementById('name').value = '';
                    resetSongsContainer();
                } else {
                    alertDiv.textContent = data.error || "Failed to submit request.";
                    alertDiv.className = 'alert error';
                }
            } catch (err) {
                alertDiv.textContent = "Error connecting to server.";
                alertDiv.className = 'alert error';
            }
        }

        async function loadRotation() {
            try {
                const response = await fetch('/api/rotation');
                const singers = await response.json();
                const listDiv = document.getElementById('rotation-list');

                if (singers.length === 0) {
                    listDiv.innerHTML = '<div class="no-singers">No singers in rotation yet.</div>';
                    return;
                }

                let html = '';
                singers.forEach((singer, index) => {
                    let cssClass = 'singer-row';
                    let badge = '';
                    if (singer.isInactive) {
                        cssClass += ' inactive';
                    }
                    if (singer.isCurrent) {
                        cssClass += ' current';
                        badge = '<span class="badge current">Current</span>';
                    } else if (singer.isNext) {
                        cssClass += ' next';
                        badge = '<span class="badge next">Next</span>';
                    }

                    html += `
                        <div class="${cssClass}">
                            <div class="singer-num">${index + 1}</div>
                            <div class="singer-details">
                                <div class="singer-name">${escapeHtml(singer.name)}${badge}</div>
                                <div class="singer-song">${escapeHtml(singer.song)} - ${escapeHtml(singer.artist)}</div>
                            </div>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            } catch (err) {
                document.getElementById('rotation-list').innerHTML = '<div class="no-singers">Failed to load rotation.</div>';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Poll rotation if on that panel
        setInterval(() => {
            if (document.getElementById('rotation-panel').classList.contains('active')) {
                loadRotation();
            }
        }, 5000);

        // --- Past Requests local storage database ---
        function saveRequestToLocal(name, songs) {
            if (name && name.trim()) {
                localStorage.setItem('ks_patron_name', name.trim());
            }

            let pastSongs = [];
            try {
                pastSongs = JSON.parse(localStorage.getItem('ks_past_songs')) || [];
            } catch (e) {
                pastSongs = [];
            }

            songs.forEach(item => {
                if (!item.song || !item.song.trim()) return;
                // Remove matching item to move it to the front
                pastSongs = pastSongs.filter(s => !(s.song.toLowerCase() === item.song.toLowerCase() && s.artist.toLowerCase() === item.artist.toLowerCase()));
                // Add to front of history
                pastSongs.unshift({ song: item.song.trim(), artist: item.artist.trim() });
            });

            // Cap at 10 items
            pastSongs = pastSongs.slice(0, 10);

            localStorage.setItem('ks_past_songs', JSON.stringify(pastSongs));
            loadPastSongs();
        }

        function loadPastSongs() {
            const container = document.getElementById('past-songs-container');
            if (!container) return;

            let pastSongs = [];
            try {
                pastSongs = JSON.parse(localStorage.getItem('ks_past_songs')) || [];
            } catch (e) {
                pastSongs = [];
            }

            if (pastSongs.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            const listDiv = document.getElementById('past-songs-list');
            listDiv.innerHTML = '';

            pastSongs.forEach(item => {
                const div = document.createElement('div');
                div.className = 'past-song-item';
                div.onclick = () => fillPastSong(item.song, item.artist);
                div.innerHTML = `
                    <div class="past-song-details">
                        <strong>${escapeHtml(item.song)}</strong> <span class="past-song-artist">by ${escapeHtml(item.artist)}</span>
                    </div>
                    <div class="add-past-icon">➕</div>
                `;
                listDiv.appendChild(div);
            });
        }

        function fillPastSong(song, artist) {
            const container = document.getElementById('songs-container');
            const entries = container.querySelectorAll('.song-entry');
            let filled = false;

            // Try to find an empty slot among existing ones
            for (let i = 0; i < entries.length; i++) {
                const titleInput = entries[i].querySelector('.song-title-input');
                const artistInput = entries[i].querySelector('.song-artist-input');
                if (!titleInput.value.trim()) {
                    titleInput.value = song;
                    artistInput.value = artist;
                    filled = true;
                    break;
                }
            }

            // If no empty slot was found, try to add a new slot (if under the 3 limit)
            if (!filled && entries.length < 3) {
                addSongEntry();
                // Find the newly added entry (which is the last child)
                const newEntries = container.querySelectorAll('.song-entry');
                const lastEntry = newEntries[newEntries.length - 1];
                const titleInput = lastEntry.querySelector('.song-title-input');
                const artistInput = lastEntry.querySelector('.song-artist-input');
                titleInput.value = song;
                artistInput.value = artist;
                filled = true;
            }

            if (filled) {
                const alertDiv = document.getElementById('status-alert');
                alertDiv.textContent = `Added "${song}" to your request form.`;
                alertDiv.className = 'alert success';
                alertDiv.style.display = 'block';
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 2000);
            }
        }

        // --- Online Song Search (iTunes API) with graceful fallback ---
        let searchTimeout = null;

        function handleSearchInput(event) {
            const query = event.target.value.trim();
            const dropdown = document.getElementById('search-results-dropdown');

            if (searchTimeout) clearTimeout(searchTimeout);

            if (!query) {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
                return;
            }

            // Debounce to avoid querying API on every keystroke
            searchTimeout = setTimeout(() => {
                performOnlineSearch(query);
            }, 300);
        }

        async function performOnlineSearch(query) {
            const dropdown = document.getElementById('search-results-dropdown');
            dropdown.innerHTML = '<div class="search-status">Searching online catalog...</div>';
            dropdown.style.display = 'block';

            try {
                // Set a timeout of 4 seconds for the fetch request so it falls back quickly if offline
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=10`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error('Search request failed');
                }

                const data = await response.json();
                displaySearchResults(data.results);
            } catch (err) {
                console.error("Online search failed or timed out:", err);
                dropdown.innerHTML = '<div class="search-status">Search unavailable (offline). Enter details below.</div>';
                // Automatically hide status after 3 seconds
                setTimeout(() => {
                    if (dropdown.querySelector('.search-status') && dropdown.innerHTML.includes('offline')) {
                        dropdown.style.display = 'none';
                    }
                }, 3000);
            }
        }

        function displaySearchResults(results) {
            const dropdown = document.getElementById('search-results-dropdown');
            if (!results || results.length === 0) {
                dropdown.innerHTML = '<div class="search-status">No results found.</div>';
                return;
            }

            dropdown.innerHTML = '';
            results.forEach(item => {
                const title = item.trackName || 'Unknown Title';
                const artist = item.artistName || 'Unknown Artist';

                const div = document.createElement('div');
                div.className = 'search-item';
                div.onclick = () => selectSearchResult(title, artist);
                div.innerHTML = `
                    <span class="search-item-title">${escapeHtml(title)}</span>
                    <span class="search-item-artist">by ${escapeHtml(artist)}</span>
                `;
                dropdown.appendChild(div);
            });
        }

        function selectSearchResult(title, artist) {
            const dropdown = document.getElementById('search-results-dropdown');
            dropdown.style.display = 'none';
            document.getElementById('online-search').value = '';

            fillPastSong(title, artist);
        }

        // Close search dropdown when clicking outside
        document.addEventListener('click', (event) => {
            const searchBox = document.getElementById('online-search');
            const dropdown = document.getElementById('search-results-dropdown');
            if (searchBox && dropdown && !searchBox.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });

        // Initialize from local storage
        document.addEventListener("DOMContentLoaded", () => {
            const savedName = localStorage.getItem('ks_patron_name');
            if (savedName) {
                const nameInput = document.getElementById('name');
                if (nameInput) nameInput.value = savedName;
            }
            loadPastSongs();
        });
    </script>
</body>
</html>
