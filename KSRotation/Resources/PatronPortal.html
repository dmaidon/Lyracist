<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSRotation - Singer Request Board</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0F172A;
            --card-bg: #1E293B;
            --primary: #8B5CF6;
            --primary-hover: #7C3AED;
            --orange: #D97706;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --gold: #FCD34D;
            --green: #4ADE80;
            --success-bg: #065F46;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        header {
            text-align: center;
            margin: 24px 0;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8B5CF6, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .tabs {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }
        .panel {
            display: none;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .panel.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            background-color: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        button.submit-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        button.submit-btn:hover {
            background-color: var(--primary-hover);
        }
        .alert {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }
        .alert.success {
            display: block;
            background-color: var(--success-bg);
            color: #A7F3D0;
        }
        .alert.error {
            display: block;
            background-color: #991B1B;
            color: #FECACA;
        }
        .song-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .remove-btn {
            background: none;
            border: none;
            color: #EF4444;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        button.add-btn {
            width: 100%;
            background-color: transparent;
            border: 2px dashed var(--primary);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            margin-bottom: 16px;
        }
        button.add-btn:hover {
            background-color: rgba(139, 92, 246, 0.1);
            border-color: var(--primary-hover);
        }
        .song-entry {
            border-bottom: 1px dashed #334155;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .song-entry:last-of-type {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .past-songs-section {
            margin-top: 24px;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
        .past-songs-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .past-songs-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .past-song-item {
            background-color: #0F172A;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .past-song-item:hover {
            border-color: var(--primary);
            background-color: rgba(139, 92, 246, 0.05);
        }
        .past-song-details {
            font-size: 0.9rem;
            color: var(--text-main);
            text-align: left;
        }
        .past-song-artist {
            color: var(--text-muted);
            font-style: italic;
        }
        .add-past-icon {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
        }
        .singer-row {
            display: flex;
            align-items: center;
            padding: 14px 12px;
            border-bottom: 1px solid #334155;
        }
        .singer-row:last-child {
            border-bottom: none;
        }
        .singer-row.rotation-start {
            background-color: rgba(239, 68, 68, 0.08);
            border-left: 4px solid var(--red);
            border-radius: 4px;
        }
        .singer-row.current {
            background-color: rgba(252, 211, 77, 0.08);
            border-left: 4px solid var(--gold);
            border-radius: 4px;
        }
        .singer-row.next {
            background-color: rgba(74, 222, 128, 0.08);
            border-left: 4px solid var(--green);
            border-radius: 4px;
        }
        .singer-row.inactive {
            opacity: 0.4;
        }
        .singer-num {
            font-weight: 700;
            font-size: 0.95rem;
            width: 32px;
            color: var(--text-muted);
        }
        .singer-details {
            flex: 1;
            min-width: 0;
        }
        .singer-name {
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .current .singer-name {
            color: var(--gold);
        }
        .next .singer-name {
            color: var(--green);
        }
        .singer-song {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-left: 8px;
        }
        .badge.current {
            background-color: var(--gold);
            color: #000;
        }
        .badge.next {
            background-color: var(--green);
            color: #000;
        }
        .no-singers {
            text-align: center;
            color: var(--text-muted);
            padding: 20px 0;
            font-style: italic;
        }
        .search-results {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            margin-top: 4px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            position: absolute;
            width: 100%;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .search-item {
            padding: 12px 16px;
            border-bottom: 1px solid #0F172A;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .search-item:last-child {
            border-bottom: none;
        }
        .search-item:hover {
            background-color: rgba(139, 92, 246, 0.15);
        }
        .search-item-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }
        .search-item-artist {
            color: var(--text-muted);
            font-size: 0.8rem;
            display: block;
            margin-top: 2px;
        }
        .search-status {
            padding: 12px 16px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .panel {
                padding: 16px 12px;
                border-radius: 12px;
            }
            h1 {
                font-size: 1.6rem;
            }
            input, button.submit-btn, button.add-btn {
                padding: 14px 12px;
                font-size: 1.05rem; /* Large enough to prevent auto-zoom on iOS */
            }
            .tab-btn {
                padding: 12px 8px;
                font-size: 0.95rem;
            }
            .singer-name {
                font-size: 1.1rem;
            }
            .singer-song {
                font-size: 0.95rem;
            }
            label {
                font-size: 0.9rem;
            }
        }

        /* Performer Profile & Avatar Styles */
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            object-fit: cover;
            margin-bottom: 10px;
            background-color: #1e293b;
        }
        .avatar-mini {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 12px;
            border: 2px solid var(--primary);
            flex-shrink: 0;
        }
        .profile-username {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--gold);
        }
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
            margin-bottom: 12px;
        }
        .file-upload-btn {
            width: 100%;
            background-color: #334155;
            color: white;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            display: block;
            transition: background 0.2s;
        }
        .file-upload-btn:hover {
            background-color: #475569;
        }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .logout-btn {
            width: 100%;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>KSRotation</h1>
            <p class="subtitle">Karaoke Request Board</p>
        </header>

        <div class="tabs">
            <button id="tab-btn-request" class="tab-btn active" onclick="switchTab('request')">Request Song</button>
            <button id="tab-btn-rotation" class="tab-btn" onclick="switchTab('rotation')">View Rotation</button>
            <button id="tab-btn-profile" class="tab-btn" onclick="switchTab('profile')">My Profile</button>
        </div>

        <!-- Request Panel -->
        <div id="request-panel" class="panel active">
            <div id="status-alert" class="alert"></div>
            <form id="request-form" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" required placeholder="e.g. Charlie">
                </div>
                <div class="form-group" id="duet-group">
                    <label for="duet-partner">Duet / Backup Partner (Optional)</label>
                    <input type="text" id="duet-partner" placeholder="e.g. Dana">
                </div>
                <div class="form-group">
                    <label>Request Type</label>
                    <div class="tabs request-type-tabs" style="margin-bottom: 0px; padding: 2px; border-radius: 8px;">
                        <button type="button" class="tab-btn active" id="type-karaoke" onclick="setRequestType('Karaoke')" style="padding: 8px; font-size: 0.85rem;">Karaoke (Sing)</button>
                        <button type="button" class="tab-btn" id="type-music" onclick="setRequestType('Music')" style="padding: 8px; font-size: 0.85rem;">Music (Play)</button>
                    </div>
                </div>
                <div class="form-group" style="position: relative;">
                    <label for="online-search">Search Songs &amp; Artists (Online)</label>
                    <input type="text" id="online-search" placeholder="Search by title, artist, or both..." oninput="handleSearchInput(event)">
                    <div id="search-results-dropdown" class="search-results"></div>
                </div>
                <div id="songs-container">
                    <div class="song-entry" id="song-entry-1">
                        <div class="song-header">
                            <label>Song 1</label>
                        </div>
                        <div class="form-group">
                            <input type="text" class="song-title-input" required placeholder="e.g. Yesterday">
                        </div>
                        <div class="form-group">
                            <input type="text" class="song-artist-input" required placeholder="e.g. The Beatles">
                        </div>
                    </div>
                </div>
                <button type="button" id="add-song-btn" class="add-btn" onclick="addSongEntry()">➕ Add Another Song</button>
                <button type="submit" class="submit-btn">Submit Request</button>
            </form>
            <!-- Past Songs Section -->
            <div id="past-songs-container" class="past-songs-section" style="display: none;">
                <h3 class="past-songs-title">Your Past Songs (Tap to request)</h3>
                <div id="past-songs-list" class="past-songs-list"></div>
            </div>
        </div>

        <!-- Rotation Panel -->
        <div id="rotation-panel" class="panel">
            <div id="rotation-list">
                <div class="no-singers">Loading rotation...</div>
            </div>
        </div>

        <!-- Profile Panel -->
        <div id="profile-panel" class="panel">
            <div id="profile-alert" class="alert"></div>
            
            <!-- Login View -->
            <div id="profile-login-view">
                <form id="profile-login-form" onsubmit="handleProfileLogin(event)">
                    <h3 style="margin-bottom: 12px; font-weight: 600;">Singer Profile Login</h3>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">
                        Log in or create a new performer profile to claim your name and customize your avatar!
                    </p>
                    <div class="form-group">
                        <label for="login-name">Performer Name</label>
                        <input type="text" id="login-name" required placeholder="e.g. Charlie">
                    </div>
                    <div class="form-group">
                        <label for="login-pin">4-Digit PIN</label>
                        <input type="password" id="login-pin" required pattern="[0-9]{4}" inputmode="numeric" maxlength="4" placeholder="Enter PIN code...">
                    </div>
                    <button type="submit" class="submit-btn">Login / Create Profile</button>
                </form>
            </div>

            <!-- Logged In View -->
            <div id="profile-details-view" style="display: none;">
                <div class="avatar-container">
                    <img id="avatar-preview-img" class="avatar-preview" src="https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&s=150" alt="Avatar Preview">
                    <div id="profile-display-name" class="profile-username">Charlie</div>
                </div>

                <form id="profile-update-form" onsubmit="handleProfileUpdate(event)">
                    <div class="form-group">
                        <label for="profile-email">Gravatar Email (optional)</label>
                        <input type="email" id="profile-email" placeholder="email@example.com">
                    </div>

                    <div class="form-group">
                        <label for="profile-vocal-range">Vocal Range (optional)</label>
                        <input type="text" id="profile-vocal-range" placeholder="e.g. Tenor, Soprano, Alto, Bass...">
                    </div>

                    <div class="form-group">
                        <label for="profile-custom-title">Custom Title (optional)</label>
                        <input type="text" id="profile-custom-title" placeholder="e.g. The Screamer, Queen of Rock...">
                    </div>

                    <div class="form-group">
                        <label for="profile-avatar-type">Avatar Source</label>
                        <select id="profile-avatar-type" onchange="toggleAvatarSourceFields()" style="width:100%; background:#0F172A; border:1px solid #334155; border-radius:8px; padding:12px; color:white; font-size:1rem; outline:none;">
                            <option value="None">Default Silhouette</option>
                            <option value="Gravatar">Gravatar Logo</option>
                            <option value="Uploaded">Upload Selfie / Photo</option>
                        </select>
                    </div>

                    <!-- Selfie Uploader Group -->
                    <div class="form-group" id="selfie-upload-group" style="display: none;">
                        <label>Upload Selfie</label>
                        <div class="file-upload-wrapper">
                            <span class="file-upload-btn">Select Selfie File</span>
                            <input type="file" id="selfie-file" accept="image/*" onchange="handleSelfieFileSelected(event)">
                        </div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">Maximum upload size: 2MB</div>
                    </div>

                    <button type="submit" class="submit-btn" style="margin-top: 16px;">Save Profile Changes</button>
                </form>

                <button class="logout-btn" onclick="handleProfileLogout()">Logout</button>
            </div>
        </div>
    </div>

    <script>
        let currentRequestType = 'Karaoke';
        function setRequestType(type) {
            currentRequestType = type;
            document.getElementById('type-karaoke').classList.toggle('active', type === 'Karaoke');
            document.getElementById('type-music').classList.toggle('active', type === 'Music');
            
            const duetGroup = document.getElementById('duet-group');
            if (duetGroup) {
                duetGroup.style.display = type === 'Karaoke' ? 'block' : 'none';
            }

            const titleLabel = document.querySelector('#songs-container .song-entry label');
            if (titleLabel) {
                titleLabel.textContent = type === 'Karaoke' ? 'Song 1' : 'Track Details';
            }
            const addBtn = document.getElementById('add-song-btn');
            if (type === 'Music') {
                if (addBtn) addBtn.style.display = 'none';
                const container = document.getElementById('songs-container');
                while (container.children.length > 1) {
                    container.removeChild(container.lastChild);
                }
                updateLabels();
            } else {
                updateAddButtonVisibility();
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tabs:not(.request-type-tabs) .tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));

            if (tab === 'request') {
                document.getElementById('tab-btn-request').classList.add('active');
                document.getElementById('request-panel').classList.add('active');
            } else if (tab === 'rotation') {
                document.getElementById('tab-btn-rotation').classList.add('active');
                document.getElementById('rotation-panel').classList.add('active');
                loadRotation();
            } else if (tab === 'profile') {
                document.getElementById('tab-btn-profile').classList.add('active');
                document.getElementById('profile-panel').classList.add('active');
                checkSingerSession();
            }
        }

        let songIndex = 1;
        function resetSongsContainer() {
            const container = document.getElementById('songs-container');
            container.innerHTML = `
                <div class="song-entry" id="song-entry-1">
                    <div class="song-header">
                        <label>Song 1</label>
                    </div>
                    <div class="form-group">
                        <input type="text" class="song-title-input" required placeholder="e.g. Yesterday">
                    </div>
                    <div class="form-group">
                        <input type="text" class="song-artist-input" required placeholder="e.g. The Beatles">
                    </div>
                </div>
            `;
            songIndex = 1;
            updateAddButtonVisibility();
        }

        function addSongEntry() {
            const container = document.getElementById('songs-container');
            const entries = container.querySelectorAll('.song-entry');
            if (entries.length >= 3) return;

            songIndex++;
            const newIndex = songIndex;
            const div = document.createElement('div');
            div.className = 'song-entry';
            div.id = `song-entry-${newIndex}`;
            div.innerHTML = `
                <div class="song-header">
                    <label>Song ${entries.length + 1}</label>
                    <button type="button" class="remove-btn" onclick="removeSongEntry(${newIndex})">Remove</button>
                </div>
                <div class="form-group">
                    <input type="text" class="song-title-input" required placeholder="e.g. Yesterday">
                </div>
                <div class="form-group">
                    <input type="text" class="song-artist-input" required placeholder="e.g. The Beatles">
                </div>
            `;
            container.appendChild(div);
            updateLabels();
            updateAddButtonVisibility();
        }

        function removeSongEntry(id) {
            const el = document.getElementById(`song-entry-${id}`);
            if (el) el.remove();
            updateLabels();
            updateAddButtonVisibility();
        }

        function updateLabels() {
            const container = document.getElementById('songs-container');
            const entries = container.querySelectorAll('.song-entry');
            entries.forEach((entry, idx) => {
                const label = entry.querySelector('label');
                if (label) label.textContent = `Song ${idx + 1}`;
            });
        }

        function updateAddButtonVisibility() {
            const container = document.getElementById('songs-container');
            const entries = container.querySelectorAll('.song-entry');
            const btn = document.getElementById('add-song-btn');
            if (entries.length >= 3) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
            }
        }

        async function submitForm(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const duetPartnerInput = document.getElementById('duet-partner');
            const duetPartner = (currentRequestType === 'Karaoke' && duetPartnerInput) ? duetPartnerInput.value.trim() : '';
            const alertDiv = document.getElementById('status-alert');

            alertDiv.className = 'alert';
            alertDiv.style.display = 'none';

            const songs = [];
            document.querySelectorAll('.song-entry').forEach(entry => {
                const song = entry.querySelector('.song-title-input').value.trim();
                const artist = entry.querySelector('.song-artist-input').value.trim();
                if (song) {
                    songs.push({ song, artist });
                }
            });

            if (songs.length === 0) {
                alertDiv.textContent = "Please request at least one song.";
                alertDiv.className = 'alert error';
                return;
            }

            try {
                const response = await fetch('/api/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, 
                        duetPartner,
                        song: songs[0].song, 
                        artist: songs[0].artist, 
                        songs: songs,
                        requestType: currentRequestType
                    })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    alertDiv.textContent = "Request submitted successfully! Look at the screens to see when you are up.";
                    alertDiv.className = 'alert success';
                    saveRequestToLocal(name, songs);
                    document.getElementById('name').value = '';
                    if (duetPartnerInput) duetPartnerInput.value = '';
                    resetSongsContainer();
                } else {
                    alertDiv.textContent = data.error || "Failed to submit request.";
                    alertDiv.className = 'alert error';
                }
            } catch (err) {
                alertDiv.textContent = "Error connecting to server.";
                alertDiv.className = 'alert error';
            }
        }

        async function loadRotation() {
            try {
                const response = await fetch('/api/rotation');
                const singers = await response.json();
                const listDiv = document.getElementById('rotation-list');

                if (singers.length === 0) {
                    listDiv.innerHTML = '<div class="no-singers">No singers in rotation yet.</div>';
                    return;
                }

                let html = '';
                singers.forEach((singer, index) => {
                    let cssClass = 'singer-row';
                    let badge = '';
                    if (singer.isInactive || singer.isPaused || singer.isSkipped) {
                        cssClass += ' inactive';
                    }
                    
                    let nameHtml = escapeHtml(singer.name);
                    if (singer.duetPartnerName && singer.duetPartnerName !== "None" && !singer.isMusic) {
                        nameHtml += ` <span style="font-size: 0.85em; opacity: 0.85; font-weight: normal;">(with ${escapeHtml(singer.duetPartnerName)})</span>`;
                    }
                    let songHtml = `${escapeHtml(singer.song)} - ${escapeHtml(singer.artist)}`;

                    if (singer.isMusic) {
                        const musicBadge = '<span class="badge" style="background-color: var(--green); color: black; margin-left: 8px;">Music</span>';
                        nameHtml = `${escapeHtml(singer.song)} ${musicBadge}`;
                        songHtml = `Background track requested by ${escapeHtml(singer.name)}`;
                        if (singer.artist) {
                            songHtml = `by ${escapeHtml(singer.artist)} • Requested by ${escapeHtml(singer.name)}`;
                        }
                    }

                    if (singer.isRotationStart) {
                        cssClass += ' rotation-start';
                        badge += '<span class="badge rotation-start" style="background-color: var(--red); color: white; margin-left: 6px;" title="Rotation Anchor (marks where a round begins)">⚓ Anchor</span>';
                    }
                    if (singer.isCurrent) {
                        cssClass += ' current';
                        badge += singer.isMusic 
                            ? '<span class="badge current">Playing</span>'
                            : '<span class="badge current">Current</span>';
                    } else if (singer.isNext) {
                        cssClass += ' next';
                        badge += singer.isMusic 
                            ? '<span class="badge next" style="background-color: var(--green); color: white;">Next Track</span>'
                            : '<span class="badge next">Next</span>';
                    }
                    if (singer.isSkipped) {
                        badge += '<span class="badge" style="background-color: var(--orange); color: white; margin-left: 6px;" title="Skipped for this round">SKIP</span>';
                    }
                    if (singer.isSpecial) {
                        badge += '<span class="badge" style="background-color: var(--primary); color: white; margin-left: 6px;" title="Special Performer (One-Time)">⭐ SPECIAL</span>';
                    }

                    if (singer.isMusic) {
                        if (singer.isCurrent) {
                            nameHtml = `${escapeHtml(singer.song)} <span class="badge current">Playing</span>`;
                        } else if (singer.isNext) {
                            nameHtml = `${escapeHtml(singer.song)} <span class="badge next">Up Next</span>`;
                        }
                    } else {
                        let titleSuffix = '';
                        if (singer.customTitle) {
                            titleSuffix = ` <span class="singer-custom-title" style="color: var(--gold); font-size: 0.85rem; font-style: italic; margin-left: 6px;">"${escapeHtml(singer.customTitle)}"</span>`;
                        }
                        let rangeSuffix = '';
                        if (singer.vocalRange) {
                            rangeSuffix = ` <span class="singer-vocal-range" style="color: var(--text-muted); font-size: 0.85rem; margin-left: 6px;">[${escapeHtml(singer.vocalRange)}]</span>`;
                        }
                        nameHtml += titleSuffix + rangeSuffix + badge;
                    }

                    let avatarUrl = `/api/singer/avatar?name=${encodeURIComponent(singer.name)}`;
                    html += `
                        <div class="${cssClass}">
                            <div class="singer-num">${index + 1}</div>
                            <img class="avatar-mini" src="${avatarUrl}" alt="${escapeHtml(singer.name)}" onerror="this.src='https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&s=150'"/>
                            <div class="singer-details">
                                <div class="singer-name">${nameHtml}</div>
                                <div class="singer-song">${songHtml}</div>
                            </div>
                        </div>
                    `;
                });
                listDiv.innerHTML = html;
            } catch (err) {
                document.getElementById('rotation-list').innerHTML = '<div class="no-singers">Failed to load rotation.</div>';
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Poll rotation if on that panel
        setInterval(() => {
            if (document.getElementById('rotation-panel').classList.contains('active')) {
                loadRotation();
            }
        }, 5000);

        // --- Past Requests local storage database ---
        function saveRequestToLocal(name, songs) {
            if (name && name.trim()) {
                localStorage.setItem('ks_patron_name', name.trim());
            }

            let pastSongs = [];
            try {
                pastSongs = JSON.parse(localStorage.getItem('ks_past_songs')) || [];
            } catch (e) {
                pastSongs = [];
            }

            songs.forEach(item => {
                if (!item.song || !item.song.trim()) return;
                // Remove matching item to move it to the front
                pastSongs = pastSongs.filter(s => !(s.song.toLowerCase() === item.song.toLowerCase() && s.artist.toLowerCase() === item.artist.toLowerCase()));
                // Add to front of history
                pastSongs.unshift({ song: item.song.trim(), artist: item.artist.trim() });
            });

            // Cap at 10 items
            pastSongs = pastSongs.slice(0, 10);

            localStorage.setItem('ks_past_songs', JSON.stringify(pastSongs));
            loadPastSongs();
        }

        function loadPastSongs() {
            const container = document.getElementById('past-songs-container');
            if (!container) return;

            let pastSongs = [];
            try {
                pastSongs = JSON.parse(localStorage.getItem('ks_past_songs')) || [];
            } catch (e) {
                pastSongs = [];
            }

            if (pastSongs.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            const listDiv = document.getElementById('past-songs-list');
            listDiv.innerHTML = '';

            pastSongs.forEach(item => {
                const div = document.createElement('div');
                div.className = 'past-song-item';
                div.onclick = () => fillPastSong(item.song, item.artist);
                div.innerHTML = `
                    <div class="past-song-details">
                        <strong>${escapeHtml(item.song)}</strong> <span class="past-song-artist">by ${escapeHtml(item.artist)}</span>
                    </div>
                    <div class="add-past-icon">➕</div>
                `;
                listDiv.appendChild(div);
            });
        }

        function fillPastSong(song, artist) {
            const container = document.getElementById('songs-container');
            const entries = container.querySelectorAll('.song-entry');
            let filled = false;

            // Try to find an empty slot among existing ones
            for (let i = 0; i < entries.length; i++) {
                const titleInput = entries[i].querySelector('.song-title-input');
                const artistInput = entries[i].querySelector('.song-artist-input');
                if (!titleInput.value.trim()) {
                    titleInput.value = song;
                    artistInput.value = artist;
                    filled = true;
                    break;
                }
            }

            // If no empty slot was found, try to add a new slot (if under the 3 limit)
            if (!filled && entries.length < 3) {
                addSongEntry();
                // Find the newly added entry (which is the last child)
                const newEntries = container.querySelectorAll('.song-entry');
                const lastEntry = newEntries[newEntries.length - 1];
                const titleInput = lastEntry.querySelector('.song-title-input');
                const artistInput = lastEntry.querySelector('.song-artist-input');
                titleInput.value = song;
                artistInput.value = artist;
                filled = true;
            }

            if (filled) {
                const alertDiv = document.getElementById('status-alert');
                alertDiv.textContent = `Added "${song}" to your request form.`;
                alertDiv.className = 'alert success';
                alertDiv.style.display = 'block';
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 2000);
            }
        }

        // --- Online Song Search (iTunes API) with graceful fallback ---
        let searchTimeout = null;

        function handleSearchInput(event) {
            const query = event.target.value.trim();
            const dropdown = document.getElementById('search-results-dropdown');

            if (searchTimeout) clearTimeout(searchTimeout);

            if (!query) {
                dropdown.style.display = 'none';
                dropdown.innerHTML = '';
                return;
            }

            // Debounce to avoid querying API on every keystroke
            searchTimeout = setTimeout(() => {
                performOnlineSearch(query);
            }, 300);
        }

        async function performOnlineSearch(query) {
            const dropdown = document.getElementById('search-results-dropdown');
            dropdown.innerHTML = '<div class="search-status">Searching online catalog...</div>';
            dropdown.style.display = 'block';

            try {
                // Set a timeout of 4 seconds for the fetch request so it falls back quickly if offline
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);

                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=10`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error('Search request failed');
                }

                const data = await response.json();
                displaySearchResults(data.results);
            } catch (err) {
                console.error("Online search failed or timed out:", err);
                dropdown.innerHTML = '<div class="search-status">Search unavailable (offline). Enter details below.</div>';
                // Automatically hide status after 3 seconds
                setTimeout(() => {
                    if (dropdown.querySelector('.search-status') && dropdown.innerHTML.includes('offline')) {
                        dropdown.style.display = 'none';
                    }
                }, 3000);
            }
        }

        function displaySearchResults(results) {
            const dropdown = document.getElementById('search-results-dropdown');
            if (!results || results.length === 0) {
                dropdown.innerHTML = '<div class="search-status">No results found.</div>';
                return;
            }

            dropdown.innerHTML = '';
            results.forEach(item => {
                const title = item.trackName || 'Unknown Title';
                const artist = item.artistName || 'Unknown Artist';

                const div = document.createElement('div');
                div.className = 'search-item';
                div.onclick = () => selectSearchResult(title, artist);
                div.innerHTML = `
                    <span class="search-item-title">${escapeHtml(title)}</span>
                    <span class="search-item-artist">by ${escapeHtml(artist)}</span>
                `;
                dropdown.appendChild(div);
            });
        }

        function selectSearchResult(title, artist) {
            const dropdown = document.getElementById('search-results-dropdown');
            dropdown.style.display = 'none';
            document.getElementById('online-search').value = '';

            fillPastSong(title, artist);
        }

        // Close search dropdown when clicking outside
        document.addEventListener('click', (event) => {
            const searchBox = document.getElementById('online-search');
            const dropdown = document.getElementById('search-results-dropdown');
            if (searchBox && dropdown && !searchBox.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });

        // --- Performer Session & Profile Logic ---
        let performerSession = null;

        function checkSingerSession() {
            const savedSession = localStorage.getItem('ks_performer_session');
            if (savedSession) {
                try {
                    performerSession = JSON.parse(savedSession);
                    showProfileDetailsView();
                    return;
                } catch (e) {
                    localStorage.removeItem('ks_performer_session');
                }
            }
            showProfileLoginView();
        }

        function showProfileLoginView() {
            document.getElementById('profile-login-view').style.display = 'block';
            document.getElementById('profile-details-view').style.display = 'none';
            document.getElementById('profile-alert').style.display = 'none';
        }

        function showProfileDetailsView() {
            document.getElementById('profile-login-view').style.display = 'none';
            document.getElementById('profile-details-view').style.display = 'block';
            document.getElementById('profile-alert').style.display = 'none';
            
            document.getElementById('profile-display-name').textContent = performerSession.name;
            document.getElementById('profile-email').value = performerSession.email || '';
            document.getElementById('profile-vocal-range').value = performerSession.vocalRange || '';
            document.getElementById('profile-custom-title').value = performerSession.customTitle || '';
            document.getElementById('profile-avatar-type').value = performerSession.avatarType || 'None';
            
            updateAvatarPreview();
            toggleAvatarSourceFields();
        }

        function updateAvatarPreview() {
            const previewImg = document.getElementById('avatar-preview-img');
            const cacheBuster = new Date().getTime();
            previewImg.src = `/api/singer/avatar?name=${encodeURIComponent(performerSession.name)}&t=${cacheBuster}`;
        }

        function toggleAvatarSourceFields() {
            const avatarType = document.getElementById('profile-avatar-type').value;
            const uploadGroup = document.getElementById('selfie-upload-group');
            uploadGroup.style.display = avatarType === 'Uploaded' ? 'block' : 'none';
        }

        async function handleProfileLogin(event) {
            event.preventDefault();
            const alertDiv = document.getElementById('profile-alert');
            const name = document.getElementById('login-name').value.trim();
            const pin = document.getElementById('login-pin').value;

            if (!name || pin.length !== 4) {
                alertDiv.textContent = "Please enter your name and a 4-digit PIN.";
                alertDiv.className = 'alert error';
                alertDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/singer/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, pin })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    performerSession = data.singer;
                    performerSession.pin = pin; // Store pin in session for update requests
                    localStorage.setItem('ks_performer_session', JSON.stringify(performerSession));
                    
                    // Pre-fill request form name too
                    localStorage.setItem('ks_patron_name', performerSession.name);
                    const nameInput = document.getElementById('name');
                    if (nameInput) nameInput.value = performerSession.name;

                    showProfileDetailsView();
                } else {
                    alertDiv.textContent = data.error || "Login failed.";
                    alertDiv.className = 'alert error';
                    alertDiv.style.display = 'block';
                }
            } catch (err) {
                alertDiv.textContent = "Error connecting to server.";
                alertDiv.className = 'alert error';
                alertDiv.style.display = 'block';
            }
        }

        async function handleProfileUpdate(event) {
            event.preventDefault();
            const alertDiv = document.getElementById('profile-alert');
            const email = document.getElementById('profile-email').value.trim();
            const vocalRange = document.getElementById('profile-vocal-range').value.trim();
            const customTitle = document.getElementById('profile-custom-title').value.trim();
            const avatarType = document.getElementById('profile-avatar-type').value;

            try {
                const response = await fetch('/api/singer/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: performerSession.name,
                        pin: performerSession.pin,
                        email: email,
                        avatarType: avatarType,
                        vocalRange: vocalRange,
                        customTitle: customTitle
                    })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    performerSession.email = email;
                    performerSession.avatarType = avatarType;
                    performerSession.vocalRange = vocalRange;
                    performerSession.customTitle = customTitle;
                    localStorage.setItem('ks_performer_session', JSON.stringify(performerSession));
                    
                    alertDiv.textContent = "Profile updated successfully!";
                    alertDiv.className = 'alert success';
                    alertDiv.style.display = 'block';
                    
                    updateAvatarPreview();
                    
                    setTimeout(() => {
                        alertDiv.style.display = 'none';
                    }, 3000);
                } else {
                    alertDiv.textContent = data.error || "Failed to update profile.";
                    alertDiv.className = 'alert error';
                    alertDiv.style.display = 'block';
                }
            } catch (err) {
                alertDiv.textContent = "Error connecting to server.";
                alertDiv.className = 'alert error';
                alertDiv.style.display = 'block';
            }
        }

        async function handleSelfieFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Cap at 2MB
            if (file.size > 2 * 1024 * 1024) {
                alert("Selfie file exceeds 2MB size limit.");
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result;
                const alertDiv = document.getElementById('profile-alert');
                
                try {
                    const response = await fetch('/api/singer/avatar/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: performerSession.name,
                            pin: performerSession.pin,
                            image: base64Data
                        })
                    });

                    const data = await response.json();
                    if (response.ok && data.success) {
                        performerSession.avatarType = 'Uploaded';
                        performerSession.avatarSource = data.avatarSource;
                        localStorage.setItem('ks_performer_session', JSON.stringify(performerSession));
                        
                        document.getElementById('profile-avatar-type').value = 'Uploaded';
                        toggleAvatarSourceFields();
                        updateAvatarPreview();

                        alertDiv.textContent = "Selfie uploaded and set as avatar!";
                        alertDiv.className = 'alert success';
                        alertDiv.style.display = 'block';
                        setTimeout(() => {
                            alertDiv.style.display = 'none';
                        }, 3000);
                    } else {
                        alertDiv.textContent = data.error || "Selfie upload failed.";
                        alertDiv.className = 'alert error';
                        alertDiv.style.display = 'block';
                    }
                } catch (err) {
                    alertDiv.textContent = "Error uploading selfie.";
                    alertDiv.className = 'alert error';
                    alertDiv.style.display = 'block';
                }
            };
            reader.readAsDataURL(file);
        }

        function handleProfileLogout() {
            performerSession = null;
            localStorage.removeItem('ks_performer_session');
            showProfileLoginView();
        }

        // Initialize from local storage
        document.addEventListener("DOMContentLoaded", () => {
            const savedName = localStorage.getItem('ks_patron_name');
            if (savedName) {
                const nameInput = document.getElementById('name');
                if (nameInput) nameInput.value = savedName;
            }
            loadPastSongs();
            checkSingerSession();
        });
    </script>
</body>
</html>
