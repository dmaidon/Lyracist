<svg xmlns="http://www.w3.org/2000/svg"
	 width="1920" height="1200"
	 viewBox="0 0 1920 1200">

	<!-- Full background (light yellow) -->
	<rect x="0" y="0" width="1920" height="1200" fill="#FFF9C4" />

	<!-- Centered Logo (scaled down for more background visibility) -->
	<g transform="translate(960, 600) scale(1.5)">
		<!-- Microphone -->
		<circle cx="0" cy="-160" r="55" fill="#000000" />
		<rect x="-40" y="-120" width="80" height="160" rx="20" fill="#000000" />
		<rect x="-15" y="40" width="30" height="80" fill="#000000" />
		<rect x="-45" y="120" width="90" height="20" rx="10" fill="#000000" />

		<!-- Circular Arrows -->
		<path d="M -260 0 A 260 260 0 0 1 0 -260"
			  fill="none" stroke="#000000" stroke-width="28" />

		<path d="M 0 -260 A 260 260 0 0 1 260 0
			 A 260 260 0 0 1 0 260"
			  fill="none" stroke="#0078D7" stroke-width="28" />

		<polygon points="260,0 310,-20 300,20" fill="#0078D7" />
	</g>

</svg>
