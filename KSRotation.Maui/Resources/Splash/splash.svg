<!-- Edited on Jul 30, 2026 @ 07:58:00 -> Simplified vector logo for MAUI splash screen compatibility -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -250 400 450">
	<!-- Purple top arc -->
	<path d="M -150 0 A 150 150 0 0 1 150 0"
		  fill="none" stroke="#A855F7" stroke-width="22" stroke-linecap="round" />

	<!-- Orange bottom arc -->
	<path d="M 150 0 A 150 150 0 0 1 -150 0"
		  fill="none" stroke="#F97316" stroke-width="22" stroke-linecap="round" />

	<!-- Microphone (High Contrast White) -->
	<g transform="scale(0.85)">
		<!-- Mic Head -->
		<circle cx="0" cy="-160" r="55" fill="#F8FAFC" />
		<!-- Mic Body -->
		<rect x="-40" y="-120" width="80" height="160" rx="20" fill="#F8FAFC" />
		<!-- Connection stem -->
		<rect x="-15" y="40" width="30" height="80" fill="#F8FAFC" />
		<!-- Weighted base -->
		<rect x="-45" y="120" width="90" height="20" rx="10" fill="#F8FAFC" />
	</g>
</svg>