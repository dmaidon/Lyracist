<svg xmlns="http://www.w3.org/2000/svg"
	 width="1900" height="1200"
	 viewBox="0 0 1900 1200">

	<!-- Full faded yellow background -->
	<rect width="1900" height="1200" fill="#FFF9C4" />

	<!-- CENTERPIECE: mic perfect, arcs corrected -->
	<g transform="translate(950, 520) scale(2.0)">

		<!-- Microphone (unchanged) -->
		<g transform="scale(0.55)">
			<circle cx="0" cy="-160" r="55" fill="#000000" />
			<rect x="-40" y="-120" width="80" height="160" rx="20" fill="#000000" />
			<rect x="-15" y="40" width="30" height="80" fill="#000000" />
			<rect x="-45" y="120" width="90" height="20" rx="10" fill="#000000" />
		</g>

		<!-- PURPLE ARC — TOP HALF (180°) -->
		<path d="M -150 0 A 150 150 0 0 1 150 0"
			  fill="none" stroke="#8000FF" stroke-width="22" />

		<!-- ORANGE ARC — BOTTOM HALF (180°) -->
		<path d="M 150 0 A 150 150 0 0 1 -150 0"
			  fill="none" stroke="#FF8C00" stroke-width="22" />
	</g>

	<!-- Title -->
	<text x="950" y="1080"
		  font-size="100"
		  font-family="Arial"
		  font-weight="700"
		  text-anchor="middle"
		  fill="#8000FF">
		KARAOKE SINGER ROTATION
	</text>

	<!-- Copyright -->
	<text x="950" y="1160"
		  font-size="42"
		  font-family="Arial"
		  text-anchor="middle"
		  fill="#444444">
		© 2026 PAROLE Software - All rights reserved.
	</text>
</svg>